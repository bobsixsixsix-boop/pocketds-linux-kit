SectionVerb {
	EnableSequence [
		# Keep speakers on the independent MultiMedia1 frontend. On the
		# current kernel, MultiMedia2 also fans out to DP0; with no valid
		# ELD the HDMI codec rejects hw_params and aborts speaker playback.
		# The control advertises two booleans, but this machine driver only
		# accepts the first frontend member; writes to member 2 remain off.
		# This is routing metadata, not a left/right speaker channel switch.
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1,0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0,0"
	]

	Include.wsae.File "/codecs/wsa884x/two-speakers/DefaultEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	# WSA macro routing — without this the upstream MUX/INP/COMP
	# stay at ZERO/off and the audio path is dead even if the
	# wsa884x codec itself is configured. Verified on the device:
	# WSA RX0 MUX=ZERO, WSA_COMP1=off until this seq runs.
	Include.wcdspk1e.File "/codecs/qcom-lpass/wsa-macro/SpeakerEnableSeq.conf"
	Include.wcdspk1d.File "/codecs/qcom-lpass/wsa-macro/SpeakerDisableSeq.conf"

	# wsa884x speaker codec — DAC switches, COMP/BOOST/PBR, PA Volume.
	#
	# This is an INLINED copy of the upstream
	# /codecs/wsa884x/two-speakers/SpeakerSeq.conf rather than an
	# Include, because UCM executes Include'd sequences AFTER a
	# section's own EnableSequence — so an override placed after the
	# include still loses to the upstream `PA Volume 12`. Inlining lets
	# us own the PA Volume value directly.
	#
	# Pocket DS loudness: the drivers are very quiet — at the upstream
	# defaults the speakers top out far below usable volume even with
	# PipeWire at 150 %. So we run the smart-amp analog PA at its
	# maximum (17 = +16.5 dB vs upstream 12 = +9 dB; verified clean on
	# the device, no clipping on a full-scale sine). The matching
	# +24 dB digital makeup on the WSA RX mixer lives below.
	EnableSequence [
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrLeft PBR Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft WSA MODE' 0"
		cset "name='SpkrLeft PA Volume' 17"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight DAC Switch' 1"
		cset "name='SpkrRight PBR Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight WSA MODE' 0"
		cset "name='SpkrRight PA Volume' 17"
		# +24 dB digital makeup on the WSA RX mixer (84 = 0 dB →
		# 108 = +24 dB). This is where the smart-amp's compressor/
		# limiter plateaus the output at the drivers' SPL ceiling;
		# pushing higher buys no extra loudness, only clipping
		# headroom loss, so 108 is the sweet spot.
		cset "name='WSA_RX0_MIX Digital Volume' 108"
		cset "name='WSA_RX1_MIX Digital Volume' 108"
	]

	DisableSequence [
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrLeft PBR Switch' 0"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrRight PBR Switch' 0"
		cset "name='SpkrRight VISENSE Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Mic" {
	Comment "Internal DMIC0/1 capture (EXPERIMENTAL, not acoustically verified)"

	# The Pocket DS DTS routes both VA DMIC0 and VA DMIC1 to vdd-micb.
	# Current upstream Qualcomm laptop/handheld UCM profiles pair these
	# two VA decimators for a two-channel internal microphone device.
	# This remains opt-in until channel mapping, gain, suspend/resume and
	# privacy behaviour have all been verified on physical hardware.
	Include.dmic0e.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
	Include.dmic0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.dmic1e.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
	Include.dmic1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}

SectionDevice."DisplayPort" {
	Comment "DisplayPort 0 playback"

	# DisplayPort remains on MultiMedia2 while speakers use MultiMedia1.
	ConflictingDevice [
		"Speaker"
	]

	# Route MM2 off the WSA speakers and onto DISPLAY_PORT_RX_0. Both
	# mixers are stereo pswitch (Front L/R) with the DP-capable
	# topology, hence the 0,0 / 1,1 pairs.
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0,0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1,1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0,0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "DP0 Jack"
		JackHWMute "Speaker"
	}
}
