Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8550/APS/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	# Wire MM1 → WSA backend at card-init time, not verb-enable time:
	# PipeWire's ALSA monitor opens the speaker PCM (hw:0,0) during
	# capability probing, before activating the HiFi verb. Without
	# this route up, snd_pcm_open on hw:0,0 returns -EINVAL and
	# WirePlumber gives up with "Object activation aborted: PipeWire
	# proxy destroyed", leaving PulseAudio on auto_null.
	cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0,0"
	cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0,0"
	# Only member 1 is writable on this machine driver. This pair selects
	# the WSA frontend; it does not encode the two physical speaker channels.
	cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1,0"
	# Analog smart-amp PA at max (17 = +16.5 dB). This card-init value
	# is superseded by the HiFi Speaker device EnableSequence (which
	# re-asserts 17 after the upstream wsa884x SpeakerSeq resets it to
	# 12), but is kept in sync here so the boot-time gain isn't briefly
	# quiet before the verb is enabled. See APS/HiFi.conf for the full
	# loudness rationale (PA 17 + WSA RX mixer +24 dB).
	cset "name='SpkrLeft PA Volume' 17"
	cset "name='SpkrRight PA Volume' 17"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
