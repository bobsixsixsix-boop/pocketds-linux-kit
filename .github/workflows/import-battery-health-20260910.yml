name: Import reviewed battery health source update
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: pocketds-reviewed-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'bobsixsixsix-boop/pocketds-linux-kit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
