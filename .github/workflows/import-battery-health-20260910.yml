                      continue
                  header, raw = record.split(b'\t', 1)
                  mode, oid, stage = header.split()
                  require(stage == b'0', 'unmerged index')
                  path = raw.decode()
                  if path != WORKFLOW:
                      rows.append([path, mode.decode(), oid.decode()])
              return hashlib.sha256(json.dumps(sorted(rows), separators=(',', ':')).encode()).hexdigest()
