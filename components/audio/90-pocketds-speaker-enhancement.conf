# Pocket DS built-in speaker tuning.
#
# This runs in the separate PipeWire filter-chain service.  The playback side
# is pinned to the validated MM1 Speaker sink, so Bluetooth, DisplayPort and
# microphone paths never pass through this graph.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Pocket DS Speakers · Enhanced"
            media.name       = "Pocket DS Speakers · Enhanced"

            filter.graph = {
                nodes = [
                    {
                        type = builtin
                        name = subsonic_guard
                        label = bq_highpass
                        control = { "Freq" = 68.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                    {
                        type = builtin
                        name = warmth
                        label = bq_lowshelf
                        control = { "Freq" = 150.0 "Q" = 0.707 "Gain" = 4.0 }
                    }
                    {
                        type = builtin
                        name = body
                        label = bq_peaking
                        control = { "Freq" = 310.0 "Q" = 0.9 "Gain" = 1.5 }
                    }
                    {
                        type = builtin
                        name = boxiness
                        label = bq_peaking
                        control = { "Freq" = 850.0 "Q" = 1.1 "Gain" = -1.2 }
                    }
                    {
                        type = builtin
                        name = edge
                        label = bq_peaking
                        control = { "Freq" = 3200.0 "Q" = 1.1 "Gain" = -1.4 }
                    }
                    {
                        type = builtin
                        name = air
                        label = bq_highshelf
                        control = { "Freq" = 7000.0 "Q" = 0.707 "Gain" = -0.8 }
                    }
                    {
                        # Reserve headroom before the gentle cubic limiter.
                        type = builtin
                        name = headroom
                        label = linear
                        control = { "Mult" = 0.60 "Add" = 0.0 }
                    }
                    {
                        type = builtin
                        name = limiter_input
                        label = clamp
                        control = { "Min" = -1.0 "Max" = 1.0 }
                    }
                    {
                        # x^3 term for y = 1.5x - 0.5x^3.
                        type = builtin
                        name = cubic
                        label = mult
                    }
                    {
                        type = builtin
                        name = soft_limiter
                        label = mixer
                        control = { "Gain 1" = 1.5 "Gain 2" = -0.5 }
                    }
                    {
                        type = builtin
                        name = output_ceiling
                        label = linear
                        control = { "Mult" = 0.96 "Add" = 0.0 }
                    }
                ]
                links = [
                    { output = "subsonic_guard:Out" input = "warmth:In" }
                    { output = "warmth:Out" input = "body:In" }
                    { output = "body:Out" input = "boxiness:In" }
                    { output = "boxiness:Out" input = "edge:In" }
                    { output = "edge:Out" input = "air:In" }
                    { output = "air:Out" input = "headroom:In" }
                    { output = "headroom:Out" input = "limiter_input:In" }
                    { output = "limiter_input:Out" input = "cubic:In 1" }
                    { output = "limiter_input:Out" input = "cubic:In 2" }
                    { output = "limiter_input:Out" input = "cubic:In 3" }
                    { output = "limiter_input:Out" input = "soft_limiter:In 1" }
                    { output = "cubic:Out" input = "soft_limiter:In 2" }
                    { output = "soft_limiter:Out" input = "output_ceiling:In" }
                ]
            }

            audio.channels = 2
            audio.position = [ FL FR ]

            capture.props = {
                node.name = "effect_input.pocketds_speaker_enhanced"
                node.nick = "Pocket DS Speakers"
                node.virtual = true
                media.class = Audio/Sink
                device.icon-name = "audio-speakers"
                priority.session = 900
                audio.channels = 2
                audio.position = [ FL FR ]
            }

            playback.props = {
                node.name = "effect_output.pocketds_speaker_enhanced"
                node.passive = true
                node.autoconnect = true
                target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
                stream.dont-remix = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
