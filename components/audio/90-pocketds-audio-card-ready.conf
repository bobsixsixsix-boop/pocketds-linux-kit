[Service]
# Replace the image's unbounded controlC0-only wait. The device node appears
# before the deferred SM8550 backends and their mixer controls are ready, which
# can make WirePlumber permanently publish a card with zero usable profiles.
ExecStartPre=
ExecStartPre=%h/.local/libexec/pocketds/pocketds-audio-card-ready --timeout 30 --interval 0.2 --stable-samples 3
