# Pocket DS: the MSM/Adreno driver can leave Plasma blocked in an
# uninterruptible dma_fence wait.  Fedora's default abort mode spends two
# full timeout periods before SIGKILL.  Keep a normal grace period, then move
# directly to the final kill path so shutdown/reboot can continue.
[Service]
TimeoutStopSec=15s
TimeoutStopFailureMode=kill
