# The Goodix GT911 can race its Qualcomm I2C parent during asynchronous
# suspend and return -EAGAIN, aborting both deep and s2idle.  Serialize device
# suspend callbacks until the kernel driver dependency is fixed.
w /sys/power/pm_async - - - - 0
# Restore normal console suspension after diagnostic no_console_suspend boots.
# Leaving it disabled forces a suspend VT switch even though DRM requests none.
w /sys/module/printk/parameters/console_suspend - - - - Y
