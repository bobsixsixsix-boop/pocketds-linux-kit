[Login]
# Suspend/resume and lock-screen authentication are not reliable on the current
# Pocket DS stack. Keep logind from suspending or locking. The user light-standby
# service owns lid DPMS; KDE PowerDevil owns the short power-button action.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
LidSwitchIgnoreInhibited=yes
HandlePowerKey=ignore
