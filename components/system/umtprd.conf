# /etc/umtprd/umtprd.conf — AYANEO Pocket DS
#
# uMTP-Responder configuration. Full option reference:
# https://github.com/viveris/uMTP-Responder/blob/master/conf/umtprd.conf

# Keep the daemon alive across cable unplug/replug.
loop_on_disconnect 1

# Expose only the user's intentional transfer area. Do not publish the full
# home directory, which contains application state and private credentials.
# The optional microSD is added at runtime by pocketds-mtp-sd-sync.
storage "/home/pocketds/Downloads" "Pocket DS Transfer" "rw"

# umtprd runs as root; make files pushed from the PC land owned by the
# default user (first and only interactive user on the image).
default_uid 1000
default_gid 1000

manufacturer "AYANEO"
product "Pocket DS"
serial "0123456789"
firmware_version "Rev A"

interface "MTP"
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"

usb_vendor_id  0x1D6B # Linux Foundation
usb_product_id 0x0100 # PTP Gadget
usb_class 0x6         # Image
usb_subclass 0x1      # Still Imaging device
usb_protocol 0x1
usb_dev_version 0x3008

# FunctionFS mode; endpoints are mounted by pocketds-mtp-gadget.
usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"

usb_max_packet_size 0x200
