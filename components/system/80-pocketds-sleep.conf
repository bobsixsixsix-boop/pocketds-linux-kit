[Sleep]
# Deep suspend stays disabled after the 2026-08-31 resume left the UFS-backed
# root filesystem unavailable.  The replacement guard now owns RTC and login1
# lifecycle ordering, but the diagnostic kernel, independent evidence channel
# and proven RAM-boot rollback path are not ready yet.  Keep the intended
# deep-only settings documented while every ordinary desktop/login1 path fails
# closed until a single attended transaction explicitly enables it.
AllowSuspend=no
SuspendState=mem
MemorySleepMode=deep
