# Pocket DS hardware policy layered after the user's normal RetroArch config.
# Core-provided geometry prevents stale custom viewport coordinates from
# placing a single-screen game on the lower display.
aspect_ratio_index = "21"
video_fullscreen = "true"
video_windowed_fullscreen = "true"

# RetroArch 1.22.2 exits immediately for its native Start+Select chord even
# when Confirm Quit is enabled. Disable that path; the Pocket DS input listener
# owns the visible two-stage Menu+View confirmation and closes only the game.
input_quit_gamepad_combo = "0"
# Retain RetroArch's own guard for any separately bound keyboard quit hotkey.
quit_press_twice = "true"
