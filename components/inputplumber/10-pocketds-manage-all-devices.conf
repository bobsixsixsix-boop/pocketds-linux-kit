# Force InputPlumber to grab every matching source device
# exclusively. Default is false (it only matches devices listed in
# /usr/share/inputplumber/devices/*.yaml AND that show up before
# the daemon starts). With ManageAllDevices=true the AYANEO
# controller's evdev (vendor 4001/0428 — registered after the
# daemon, since the gamepad emulation comes up after USB enum)
# gets picked up and exclusively grabbed, which is required for
# the joymouse profile to actually intercept stick events.
[Service]
ExecStartPost=/usr/bin/sh -c '\
    until busctl --quiet call org.shadowblip.InputPlumber \
        /org/shadowblip/InputPlumber/Manager \
        org.freedesktop.DBus.Properties Set ssv \
        org.shadowblip.InputManager ManageAllDevices b true \
        2>/dev/null; do sleep 0.5; done'
