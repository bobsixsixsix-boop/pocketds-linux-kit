# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
version: 2
kind: CapabilityMap
name: AYANEO MCU Mapping (Xbox mode)
id: ayaneo_mcu_xbox

mapping:
  # The physical '=' key was identified as BTN6 (scan 0x90007) in the
  # device's existing per-key evtest record. The profile decides whether it
  # means Steam/Home or the View + '=' mode chord. BTN7 is deliberately not
  # folded into this mapping: its old label conflicts with the verified AYA
  # path and does not identify the physical '=' key.
  - name: Physical equals key → Steam/Xbox Guide
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN6
          value_type: button
    target_event:
      gamepad:
        button: Guide

  # These are the existing, device-local brightness routes. Keep their raw
  # identity intact; profiles consume the two logical quick-access slots as
  # brightness actions, while AYA uses a separate internal slot below.
  - name: MCU BTN_MODE (scan 0x9000d) → Brightness Up
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess

  - name: MCU BTN_2 (scan 0x90003) → Brightness Down
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN2
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess2

  # Keep the LC/RC slots that were already verified on this device.
  - name: MCU BTN_3 → RightPaddle2
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN3
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle2

  - name: MCU BTN_4 → LeftPaddle2
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN4
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle2

  - name: South Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SOUTH
          value_type: button
    target_event:
      gamepad:
        button: South

  - name: West Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_WEST
          value_type: button
    target_event:
      gamepad:
        button: West

  - name: North Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_NORTH
          value_type: button
    target_event:
      gamepad:
        button: North

  - name: East Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_EAST
          value_type: button
    target_event:
      gamepad:
        button: East

  - name: Start Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_START
          value_type: button
    target_event:
      gamepad:
        button: Start

  - name: Select Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SELECT
          value_type: button
    target_event:
      gamepad:
        button: Select

  # The physical AYA key was the device's existing BTN5 → Super route. Move
  # only that known raw input into the profile's internal Keyboard slot. In
  # gamepad mode the profile turns it into Steam Quick Access; in joymouse it
  # is consumed without producing Super or a loose keyboard modifier.
  - name: AYA logo → internal profile slot
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN5
          value_type: button
    target_event:
      gamepad:
        button: Keyboard

  - name: Right Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_GAS
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: RightTrigger

  - name: Left Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_BRAKE
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: LeftTrigger

  - name: Right Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TR
          value_type: button
    target_event:
      gamepad:
        button: RightBumper

  - name: Left Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TL
          value_type: button
    target_event:
      gamepad:
        button: LeftBumper

  - name: Right Paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_C
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle1

  - name: Left Paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_Z
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle1

  # Pocket DS hardware revision quirk: the AYANEO Controller evdev
  # (vendor 4001/0428) exposes the right stick on ABS_Z + ABS_RZ,
  # not ABS_RX + ABS_RY. Triggers live on ABS_GAS/ABS_BRAKE so Z/RZ
  # are free for the second stick. Verified on /dev/input/event6.
  - name: Right Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_Z
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_RZ
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: RightStick

  - name: Left Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_X
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_Y
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: LeftStick

  - name: Right Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBR
          value_type: button
    target_event:
      gamepad:
        button: RightStick

  - name: Left Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBL
          value_type: button
    target_event:
      gamepad:
        button: LeftStick

  - name: Dpad Left
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0X
          value_type: button
          axis_direction: negative
    target_event:
      gamepad:
        button: DPadLeft

  - name: Dpad Right
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0X
          value_type: button
          axis_direction: positive
    target_event:
      gamepad:
        button: DPadRight

  - name: Dpad Down
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0Y
          value_type: button
          axis_direction: positive
    target_event:
      gamepad:
        button: DPadDown

  - name: Dpad Up
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0Y
          value_type: button
          axis_direction: negative
    target_event:
      gamepad:
        button: DPadUp

filtered_events: []
