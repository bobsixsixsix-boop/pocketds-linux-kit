# ROCKNIX FAT ESP — what the signed Qualcomm ABL looks for.
#
# Hard requirements from the ABL (see copr/rocknix-abl/REVERSE-ENGINEERING.md):
#   * GPT PARTLABEL must be exactly "ROCKNIX"
#   * FAT volume label should also be "ROCKNIX" so the SD-card boot path
#     works even when the partition table is MBR (ROCKNIX's own
#     scripts/mkimage uses msdos for SD; the ABL falls back to scanning
#     FAT volume labels in that case).
#   * Filesystem must be FAT (vfat handles both FAT16 and FAT32)
#   * One of \EFI\BOOT\BOOTAA64.EFI / \KERNEL / \boot\Image must be present
#
# We target \boot\Image — the raw arm64 kernel produced by ../copr/kernel
# with the cmdline baked in via CONFIG_CMDLINE.
#
# IMPORTANT: only narrow paths get copied here. A blanket CopyFiles=/boot/
# would also pull in:
#   - /boot/efi/EFI/BOOT/BOOTAA64.EFI         (systemd-boot package %post)
#   - /boot/loader/{entries,entries.srel}    (systemd-boot)
#   - /boot/fedora/<kver>/{linux,initrd}     (kernel-install BLS plugin)
#   - /boot/symvers-*.xz                      (Fedora kernel scriptlet)
# All of which the ABL doesn't need and which actively hide the real
# boot path (a stub BOOTAA64.EFI shadows our \boot\Image).

[Partition]
Type=esp
Label=ROCKNIX
Format=vfat
SizeMinBytes=512M
SizeMaxBytes=512M
# The bootable Image retains the upstream path. The DTB stays in the rootfs
# at /lib/modules/<kver>/dtb/qcom/...; ABL gets its own DTB from the
# SoC firmware / dtb partition and patches /chosen with the cmdline.
CopyFiles=/boot/Image:/boot/Image
# Downstream Kit helper: the FAT is mounted at /boot at runtime, so its
# root-level script must remain visible as /boot/PocketDS-Switch-to-Linux.sh.
CopyFiles=/boot/PocketDS-Switch-to-Linux.sh:/PocketDS-Switch-to-Linux.sh
SplitName=esp
