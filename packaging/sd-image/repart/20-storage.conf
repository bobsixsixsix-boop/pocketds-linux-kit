# STORAGE ext4 root — the Fedora root filesystem.
#
# The ABL never touches this partition by name (only the ROCKNIX UNINSTALL
# menu mentions it, see RE doc), but our dracut module
# (pocketds-mount-storage.sh) consumes disk=PARTLABEL=STORAGE and mounts it
# rw at /sysroot/storage. We *also* set root=PARTLABEL=STORAGE so dracut's
# normal mount-root chain mounts the same partition as / — /storage then
# becomes a bind on top.
#
# SizeMaxBytes is the upper bound for the artefact size — the actual
# partition still grows to fill the eMMC/SD on first boot via
# pocketds-fs-resize.service. With full Plasma 6 + initial-setup +
# device-specific COPR packages, the rootfs lands around 8-10 GiB
# uncompressed; 12 GiB gives ~20 % headroom for ext4 metadata,
# /var/cache/dnf leftovers, and journal slack so populate_fs doesn't
# fail with ENOSPC mid-copy.

[Partition]
Type=root
Label=STORAGE
Format=ext4
SizeMinBytes=8G
SizeMaxBytes=12G
CopyFiles=/
MakeDirectories=/storage /flash /var/log /var/cache /var/tmp /var/lib
