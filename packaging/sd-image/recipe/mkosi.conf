# Local engineering rootfs; assembled into the SD image after staging and audit.
[Distribution]
Distribution=fedora
Release=44
Architecture=arm64

[Output]
Format=directory
Output=pocketds-kde-rootfs
OutputDirectory=output
ManifestFormat=json,changelog

[Content]
Bootable=no
Bootloader=none
BiosBootloader=none
ShimBootloader=none
Initrds=
KernelModulesIncludeHost=no
RootPassword=hashed:!*
Hostname=pocketds
Locale=zh_CN.UTF-8
Timezone=UTC
WithRecommends=no
PackageDirectories=packages
Packages=pocketds-kde
         @kde-desktop
         @kde-apps
         pocketds-userspace-20260507-20260730174706.pds2.fc44.noarch
         powerdevil-6.7.3-1.fc44.pocketds1.aarch64
         systemd
         systemd-udev
         systemd-container
         systemd-resolved
         NetworkManager
         firewalld
         sudo
         passwd
         cracklib-dicts
         shadow-utils
         openssh-server
         bash-completion
         vim-default-editor
         less
         coreutils
         util-linux
         e2fsprogs
         dosfstools
         parted
         gdisk
         dnf5
         firefox
         plasma-discover-flatpak
         plasma-discover-packagekit
         plasma-discover-offline-updates
         python3
         python3-evdev
         python3-dbus
         python3-gobject
         python3-pyatspi
         at-spi2-core
         kf6-kpackage
         jq
         tuned
         plasma-milou
         inputplumber
         libgpiod-utils
         libseccomp
         pipewire-utils
         pulseaudio-utils
         alsa-utils
         kdialog
         kscreen
         fcitx5
         fcitx5-autostart
         fcitx5-gtk
         fcitx5-rime
         librime-lua
         glibc-langpack-en
         glibc-langpack-zh
         google-noto-sans-cjk-fonts
         google-noto-sans-mono-fonts
         gtk3
         xorg-x11-server-Xwayland

[Build]
BuildSources=
WorkspaceDirectory=workspace
PackageCacheDirectory=cache
UseSubvolumes=no
WithNetwork=no

[Validation]
SecureBoot=no
